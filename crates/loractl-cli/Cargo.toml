[package]
name = "loractl-cli"
description = "loractl — a terminal-native LoRA trainer CLI (CLI-first; a GUI can be layered on the same core later)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[[bin]]
name = "loractl"
path = "src/main.rs"

[features]
# Passthrough to loractl-core's GPU backends (M7, #18). None default, so the
# stock CLI build stays offline/ndarray. `just run-wgpu` builds with `wgpu` so a
# `compute.backend: wgpu` config actually reaches core's wgpu dispatch arm
# (without this the flag/config is a runtime no-op that bails). cuda/tch are
# passthrough-only and not runnable on this machine.
wgpu = ["loractl-core/wgpu"]
candle = ["loractl-core/candle"]
cuda = ["loractl-core/cuda"]
tch = ["loractl-core/tch"]
# Opt-in loss/LR curve PNG written next to the adapter at run end (#215). A
# CLI-side renderer over the `TrainEvent` stream (`src/plot.rs`); core gains
# nothing. Off by default so the stock build stays free of the plotting tree.
plot = ["dep:plotters"]

[dependencies]
loractl-core = { path = "../loractl-core" }
anyhow.workspace = true
# NOTE: no direct `serde` dependency — the CLI derives nothing and names no
# serde trait; every type it serializes is defined in core. `serde_json` below
# carries the serde it needs. (Found by `just dead-code`.)
# `inspect` renders a LoRA's `__metadata__` header, whose structured values
# (`ss_tag_frequency`, `ss_bucket_info`) are JSON *inside* strings — this
# re-renders them readably. Rendering is a front-end concern, so the
# formatting lives here, not in core.
serde_json.workspace = true
tracing.workspace = true
clap = { version = "=4.6.7", features = ["derive"] }
clap_complete = "=4.6.11"
figment = { version = "=0.10.19", features = ["yaml", "env"] }
indicatif = "=0.18.6"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
# Error/panic reporting to GlitchTip (Sentry-API compatible). DSN comes from
# the SENTRY_DSN env var; rustls transport avoids a system OpenSSL dependency.
# Since sentry 0.49 (reqwest 0.13) that transport uses aws-lc-rs (needs a C
# toolchain to build) and verifies certificates against the OS trust store, not
# embedded webpki roots — an https DSN needs CA certificates installed on the
# host. An http:// DSN (the README example) never touches TLS.
sentry = { version = "=0.49.3", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "anyhow",
    "tracing",
    "reqwest",
    "rustls",
] }
# Loss/LR curve renderer (`plot` feature, #215). Bitmap backend only, with the
# pure-Rust `ab_glyph` font path: the default `ttf` feature pulls font-kit and
# with it system freetype/fontconfig, which a CLI build must not need. The one
# font is embedded (assets/fonts, license alongside).
plotters = { version = "=0.3.7", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "ab_glyph",
    "line_series",
], optional = true }

[dev-dependencies]
# `figment::Jail` (env + cwd isolation for the config-precedence tests) is
# gated behind figment's `test` feature.
figment = { version = "=0.10.19", features = ["yaml", "env", "test"] }

# Released by dist as `loractl` (ADR-0014): `brew install laurigates/tap/loractl`
[package.metadata.dist]
formula = "loractl"
