[package]
name = "loractl-core"
description = "Core training pipeline for loractl — config schema, event stream, and the Trainer contract. No CLI, no I/O-presentation opinions."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
# Throughput measurement (#110): the backend-agnostic RESULT/SANITY/MODEL line
# schema, the wall-sync timer (the cubecl#1421 workaround) and the dead-graph
# guards, ported from CAEF. Dependency-free itself, so this adds no external
# surface; `src/bench.rs` is the burn-side adapter over it. Deliberately a
# normal dependency and not a dev-dependency: timing a run is a library
# capability the CLI and API can both reach for, not a test fixture.
loractl-bench = { path = "../loractl-bench" }
# ML backend. `ndarray` is the portable CPU backend (no GPU/CUDA needed for the
# MNIST correctness harness); `autodiff` wraps a backend for training. Backends
# stay generic so a GPU backend (wgpu/cuda) can be swapped in later.
burn = { version = "0.21", default-features = false, features = [
    "std",
    "ndarray",
    "autodiff",
] }
# Safetensors weight loading for the real GPT-2 (M3, #2). Pinned to 0.21.0 to
# unify `burn-core` with the `burn` umbrella above. `safetensors` gives the
# format reader; `std` pulls memmap2 (used by `from_file`) + regex (the
# LayerNorm key remapper). Fully offline — no HTTP client — so the always-run
# tiny-GPT-2 parity test loads the checked-in fixture without touching the
# network.
# Re-enable burn-ndarray's DEFAULT `multi-threads` (rayon +
# `matrixmultiply/threading`) and `simd`, which `default-features = false` on
# the `burn` umbrella above silently drops -- burn exposes a `simd` passthrough
# but none for `multi-threads`, so a direct dependency is the only route
# (upstream: tracel-ai/burn#5332). This is the whole reason the CPU encode phase
# ran on one core.
#
# It matters because `diffusion_trainer.rs` pins the dataset encode to the
# ndarray CPU backend deliberately (f16 overflows the Qwen encoders; burn 0.21's
# wgpu f32 corrupted sequential encoder outputs). Measured on a 24-core x86_64
# host: 598.7 s/image -> 68.6 s/image, ~8.7x, and a 40-image cold cache fill
# from ~6.7 h to 40 min. The win saturates near 4 threads, so it is not
# contingent on a large core count.
#
# `simd` is deliberately NOT enabled alongside it. It is the smaller lever
# (78.8 vs 94.2 ms/matmul, against 32.0 for multi-threads) and it breaks
# `tests/grad_checkpointing.rs::checkpointing_is_numerically_identical_to_stored_activations`,
# which asserts BalancedCheckpointing replays bit-identical losses -- SIMD
# reduction order makes the replay differ in the 7th significant digit.
# Isolated by feature: `multi-threads` alone passes that test, `simd` alone
# fails it, at any thread count. Dropping simd costs ~2.5% of the matmul win.
#
# THIS DEPENDENCY IS ON A DEPRECATION PATH, AND FLEX IS NOW MEASURED FASTER.
# burn's maintainers answered #5332 (2026-08) with "we could forward a
# pass-through feature flag as suggested" AND "the plan is to deprecate
# burn-ndarray and only keep burn-flex", asking that flex match whatever
# performance ndarray is giving us.
#
# `examples/cpu_backend_probe.rs` (`just flex-probe`) answered that on the
# 24-thread box, at the encode-bound shape (seq 512, hidden 2560):
#
#   ndarray, 1 thread     75.78 ms       flex, scalar            55.41 ms
#   ndarray, multi-threads 32.27 ms      flex + rayon            11.09 ms
#                                        flex + rayon + simd     11.14 ms
#
# flex+rayon is ~2.9x FASTER than the threaded ndarray configured below, at
# identical output (parity 6.3e-7 of magnitude), every arm sanity=ok. So
# migrating is an optimization in its own right, not merely a hedge against the
# deprecation -- and `simd` buys nothing on x86 (inside the ~7% control spread),
# so the flex arm to want is `rayon` alone.
#
# Two gates still stand between here and swapping the encode backend, neither of
# which the probe covers: the real encode phase on real Qwen weights (the probe
# is one matmul), and a re-run of `tests/grad_checkpointing.rs` bit-identity
# against a flex-backed trainer, since flex's SIMD is the same class of lever
# that already fails it here.
burn-ndarray = { version = "0.21", default-features = false, features = [
    "std",
    "multi-threads",
] }
# The successor CPU backend, for `examples/cpu_backend_probe.rs` only — optional
# and absent from `default`, so it costs the normal build nothing. The `[features]`
# block below documents why it is declared directly (same reason as burn-ndarray
# above: `rayon` has no passthrough on the umbrella) and what the probe answers.
burn-flex = { version = "0.21", default-features = false, features = [
    "std",
], optional = true }
burn-store = { version = "0.21.0", default-features = false, features = [
    "safetensors",
    "std",
] }
# Adapter sidecar metadata (M4, #3) and the periodic validation-sample report
# `BurnTrainer` writes — both library code, not just tests, so this lives here
# rather than in [dev-dependencies].
serde_json.workspace = true
# Generic LoRA injection (M6, #17): `regex` matches config target patterns
# against module paths; `safetensors` is the direct writer for the kohya-ss
# adapter export (arbitrary keys + transpose + `.alpha` scalar — a shape
# burn-store's snapshot-save can't express). Both already ride in transitively
# via burn-store at these exact versions, so depending on them directly adds no
# new external surface.
regex = "1"
safetensors = "0.7"
# Qwen3-VL caption conditioning (M10, #21): loads the HF `tokenizer.json`
# shipped with Krea-2-Raw so `Qwen3VlConditioner` can tokenize captions
# through the krea-2 chat template. Pure offline — file-based loading only,
# no hub/HTTP features.
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
# Scaled-fp8 checkpoint loading (M15, #82): `fp8.rs` mmaps the safetensors
# file once and shares it across its lazy dequant closures — the same crate
# (and pattern) burn-store's own lazy file path uses, so this already rides
# in transitively at this exact version via burn-store's `std` feature.
memmap2 = "0.9"
# Image dataset pipeline (M12, #23): decode + resize the training images.
# Default features off — only the two formats the kohya-style folder
# convention actually uses; no HDR/EXR/AVIF subtree.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Parallel image decode/resize in the encode phase (#178). The decoder is
# already SIMD-capable (image 0.25 decodes JPEG through zune-jpeg), so the cost
# is resize + pixel shuffling, and the only lever left is doing several images
# at once. Confined to the host-side pixel work: the encode closures are FnMut
# and GPU-bound, and burn tensors carry no `Send` bound. Already resolved in
# the tree via `tokenizers`, so this adds no new external surface.
rayon.workspace = true
# On-demand tokenizer fetch (ComfyUI support): a ComfyUI install ships no
# `tokenizer.json`, so when neither `model.tokenizer` nor the base-dir file
# exists, `hf.rs` fetches the model-invariant Qwen3-VL tokenizer once, verifies
# a pinned SHA-256, and caches it under `HF_HOME`. `ureq` is a minimal
# pure-Rust blocking client over the rustls stack already in the workspace
# tree; `sha2` (already transitive via burn-store) does the integrity check.
# The fetch is lazy — a run with a local tokenizer never touches the network,
# so offline CI is unaffected.
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"

[features]
# GPU compute backends (M7, #18). None are in `default`, so `cargo build`/
# `clippy`/`test` and CI stay offline and GPU-free on the always-available
# ndarray+autodiff backend. Each activates a burn backend feature; the runtime
# dispatch arm in `burn_trainer.rs` is `#[cfg]`-gated on the matching feature.
#
# - `wgpu`: Metal on macOS/Apple-Silicon, Vulkan/DX12 elsewhere. The ONE GPU
#   backend runnable + verifiable on this dev machine (`just test-wgpu`).
# - `cuda`: NVIDIA only; needs the CUDA toolkit/nvcc at build time — NOT
#   buildable or runnable on darwin. Compile-verifiable only on a Linux+NVIDIA host.
# - `tch`: libtorch; needs a linked libtorch binary — NOT exercised here.
wgpu = ["burn/wgpu"]
cuda = ["burn/cuda"]
tch = ["burn/tch"]
# candle: burn's candle-core backend with Metal kernels — an alternative GPU
# path on macOS with a completely independent kernel stack from cubecl/wgpu,
# and the only burn backend offering bf16 on Metal (the Krea-2 checkpoint's
# native dtype, with f32-like range). Added while isolating wgpu autodiff
# numeric corruption on Apple Silicon (see examples/grad_compare.rs).
candle = ["burn/candle", "burn/candle-metal"]
# Opt-in real-MNIST training. `burn/dataset` pulls burn-dataset (where
# `MnistDataset` lives) and `burn/vision` activates its vision datasets. This
# pulls reqwest/tokio and downloads MNIST over the network at runtime, so it is
# NEVER in the default set — the default build/`cargo test` stays offline and
# lean. Exercised on demand via `just test-mnist` / `just lint-mnist`.
mnist = ["burn/dataset", "burn/vision"]
# Opt-in real pretrained-GPT-2 parity test (`tests/gpt2_real.rs`). No extra
# crates: the real weights + golden are produced locally by the Python
# reference (`just gpt2-reference`, which downloads openai-community/gpt2 via
# transformers) and the Rust test reads them from disk. Kept out of the default
# build so `cargo test` stays offline and needs no multi-hundred-MB fixture.
gpt2-real = []
# Opt-in real Qwen-Image VAE parity test (`tests/qwen_vae_real.rs`, M9). Same
# shape as `gpt2-real`: no extra crates; the real weights + golden come from
# `just vae-real-reference` (downloads Qwen/Qwen-Image's vae via diffusers).
qwen-vae-real = []
# Opt-in real Krea-2-Raw text-encoder parity test (`tests/qwen3vl_real.rs`,
# M10). Same shape: fixtures come from `just qwen3vl-real-reference`.
qwen3vl-real = []
# Opt-in real Krea-2-Raw MMDiT staged-parity test (`tests/mmdit_real.rs`,
# M11; depth-truncated — see the test docs). Fixtures: `just mmdit-real-reference`.
mmdit-real = []
# `burn-flex` CPU backend, for `examples/cpu_backend_probe.rs` only (`just
# flex-probe`). burn's maintainers have said on tracel-ai/burn#5332 that
# burn-ndarray is slated for deprecation with flex the survivor, and asked
# whether flex matches the threaded-ndarray performance the encode phase
# currently depends on. Nothing in the library routes through flex — this is a
# measurement dependency, kept out of `default` so the normal build, `just
# lint` and CI are untouched.
#
# The features are split three ways for the same reason the burn-ndarray block
# above splits multi-threads from simd: threading and SIMD are separate levers
# with separate risks, and an arm that bundles them cannot tell you which one
# paid. `flex` alone is the single-threaded scalar baseline; the other two add
# one lever each.
#
# Note the shape of this dependency — it is the workaround, and it is the same
# workaround: burn-flex's OWN defaults are ["std", "simd", "rayon"], and the
# umbrella's `default-features = false` drops all three, so a direct dependency
# is again the only route. Verified against burn main (d5865f5d) by varying only
# the consumer's `burn` features and reading `cargo tree -e features -i
# burn-flex`:
#
#   ["std"]                  -> std          (burn-flex is compiled REGARDLESS:
#   ["std", "simd"]          -> std           burn-dispatch depends on it
#   ["std", "flex"]          -> std           NON-optionally)
#   ["std", "flex", "simd"]  -> std, simd
#   default features + flex  -> std, simd, rayon
#
# So `simd` is recoverable only when `flex` is ALSO on — `burn-flex?/simd` is
# the weak form, keyed on burn's own optional dep rather than on the crate being
# in the graph — and `rayon` is recoverable at no feature combination. That is
# #5332 one backend over, on the backend meant to outlive it, and it is why the
# follow-up on that issue proposes the STRONG form (`burn-flex/rayon`, no `?`):
# the weak form cannot reach the instance burn-dispatch already pulls in.
flex = ["burn/flex", "dep:burn-flex"]
flex-rayon = ["flex", "burn-flex/rayon"]
flex-simd = ["flex", "burn-flex/simd"]

[dev-dependencies]
# `tests/adapter_metadata.rs` recomputes the exported LoRA's
# `sshs_model_hash` from the finished file — an INDEPENDENT check of the
# consumer's algorithm, so it must hash for itself rather than trust the
# exporter. Same version the library already pins.
sha2 = "0.10"
# int4 (Q4S) frozen-base quantization goldens (#96). burn-ndarray gates its Q4
# `quantize` behind the empty `export_tests` feature (Q8/int8 is always on; Q4 is
# not) — so the offline int4 quant tests need it enabled. As a dev-dependency it
# feature-unifies into `cargo test` (the same burn-ndarray the lib pulls via
# `burn/ndarray`, now with export_tests), but stays OUT of `cargo build`/
# `just install` — the real cuda run never touches the ndarray Q4 path.
# `default-features = false` so it adds only export_tests to whatever features
# burn already turns on; unification is additive, so std/simd/etc. are unaffected
# and the int8 goldens are untouched (export_tests only ADDS the Q4/Q2 arms).
burn-ndarray = { version = "0.21", default-features = false, features = [
    "export_tests",
] }
# ADR-0005 step-VRAM probe (`examples/step_probe.rs`): loads a TrainConfig
# from YAML the same way the CLI does (file layer only — the probe documents
# itself as env-free). Examples build against dev-dependencies, so the
# library surface is untouched; same version + feature the CLI already pins,
# so no new external surface rides into Cargo.lock.
figment = { version = "0.10", features = ["yaml"] }
