# actionlint config. Declares the custom labels of the self-hosted RTX 4090
# runner used by gpu.yml (#113), so actionlint doesn't flag them as unknown.
# Mirrors the runner labels CAEF (custom-attention-engine-framework) registers
# on the same class of hardware.
self-hosted-runner:
  labels:
    - gpu
    - cuda
    - wgpu

# release.yml is generated by `dist generate` (ADR-0014) and is overwritten on
# every regeneration, so hand fixes there do not survive. Its only findings are
# shellcheck info/style notes (SC2086 quoting, SC2129 grouped redirects) in
# dist's own templates; ignore exactly those, keep every other check.
paths:
  .github/workflows/release.yml:
    ignore:
      - 'SC2086:info'
      - 'SC2129:style'
