name: actionlint

# Static check of workflow YAML (#248). Several workflows (gpu.yml above all)
# are dispatch-only or release-only, so a broken expression or an action major
# bump otherwise surfaces only when that workflow next runs. Uses the repo's
# .github/actionlint.yaml (declares the self-hosted runner labels).
# Mirrors `just lint-actions`.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/actionlint.yaml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/actionlint.yaml"

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Pinned release of the official installer; shellcheck is preinstalled on
      # ubuntu-latest, so `run:` blocks are checked too.
      - name: Install actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
      - name: actionlint
        run: ./actionlint -color
