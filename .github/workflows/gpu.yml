name: GPU

# Dispatchable self-hosted RTX 4090 GPU CI (#113). Adopts CAEF's
# (custom-attention-engine-framework) proven bench.yml / ci.yml template on
# the same class of hardware (very likely the same physical 4090 as `popos`).
#
# workflow_dispatch ONLY — hosted CI (ci.yml) stays GPU-free (the `ndarray`
# default backend already runs there). This job is opt-in: dispatch it to turn
# the manual on-box proofs (the burn#5162 numerics probes, the #96 int8
# VRAM/dequant proof, the cuda/wgpu smokes) into a repeatable CI artifact
# instead of a hand-run on the box.
#
# Runner: the self-hosted popos box, registered with the same labels CAEF uses
# ([self-hosted, gpu] + gpu,cuda / gpu,wgpu). It processes one job at a time,
# so these jobs never contend for the GPU within a run.
#
#   gh workflow run gpu.yml                          # cuda smokes (default)
#   gh workflow run gpu.yml -f suite=all             # cuda + wgpu smokes
#   gh workflow run gpu.yml -f int8_probe=true       # + the #96 int8 proof
#   gh workflow run gpu.yml -f bench=true            # + the #110 throughput bench

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which GPU smoke suite(s) to run"
        required: true
        type: choice
        options:
          - cuda
          - wgpu
          - all
        default: cuda
      int8_probe:
        description: "Also run the #96 on-box int8 VRAM/dequant proof (quant_probe)"
        required: false
        type: boolean
        default: false
      denoiser:
        description: "Krea-2 denoiser checkpoint for the int8 probe (staged on the runner)"
        required: false
        type: string
        # The checkpoint is already staged in the box's ComfyUI models tree
        # (see CLAUDE.local.md). Overridable per-dispatch.
        default: /mnt/sabrent/comfyui-workspace/ComfyUI/models/diffusion_models/krea2/krea2_raw_fp8_scaled.safetensors
      bench:
        description: "Also run the #110 step-throughput bench (bench_step)"
        required: false
        type: boolean
        default: false
      bench_args:
        description: "Args forwarded to `just bench` (config path + flags)"
        required: false
        type: string
        # Pass --seq-len: without it the token count is image-only and
        # understates tok_s/tflops (see the bench_step example header).
        default: config/examples/krea2-comfyui.yaml --steps 8 --seq-len 1536
      bench_model_base:
        description: "ComfyUI models/ root for the bench (staged on the runner)"
        required: false
        type: string
        # The example config's `model.base` is the placeholder
        # `/home/you/ComfyUI/models`; this is the box's real tree.
        default: /mnt/sabrent/comfyui-workspace/ComfyUI/models
      bench_dataset:
        description: "Dataset path for the bench (staged on the runner) — REQUIRED"
        required: true
        type: string
        # Deliberately NO default. A default here is a claim the repo cannot
        # keep: the staged path lives only on the runner, is not tracked, and
        # sits among unrelated directories with nothing marking it as loractl's
        # — so a routine disk cleanup silently deleted the previous default
        # (`.../loractl-int4-ds`, gone 2026-08-05) and the next dispatch failed
        # on a path the workflow still advertised. Requiring it also matches
        # `bench_step`'s own contract: a measurement is described by its
        # invocation, so a bench result names the dataset it measured.

permissions:
  contents: read

concurrency:
  # One GPU run at a time — the runner serializes anyway, but this keeps
  # re-dispatches from piling up in the queue.
  group: gpu-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The runner's root disk is small, shared with a second runner, and sits
  # ~90% full at rest. A debug-profile `cargo test` over this dependency graph
  # (burn + cubecl + tokenizers) writes ~14 GB of artifacts, dominated by DWARF
  # — a single `libloractl_core` rlib is ~107 MB — and the concurrent links at
  # the end are the peak. When the filesystem fills mid-link, `rust-lld` does
  # not report ENOSPC: it mmaps its output, so the failed page-in arrives as
  # SIGBUS and the job dies with `ld terminated with signal 7 [Bus error]`,
  # which reads as a toolchain bug rather than a full disk. Observed killing
  # `cuda smokes` on three consecutive dispatches, including one taken right
  # after freeing 7 GB — headroom alone does not fix it.
  #
  # `line-tables-only` keeps backtrace file/line (what a failing GPU smoke is
  # read for) and drops the variable/type DWARF that is the bulk. It changes
  # debuginfo only, never codegen, so the smokes still exercise the same code.
  # `dev` covers the dependencies, `test` the test targets that inherit it.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # cuda f32 is the known-clean GPU path on this box (burn#5162 does NOT affect
  # cuda f32; see .claude/rules/burn-wgpu-metal-numerics.md). Runs the same
  # smokes `just test-cuda` runs locally: the synthetic f32 + grad-checkpointing
  # smoke and the tiny-krea2 diffusion e2e.
  cuda-smokes:
    name: cuda smokes (self-hosted GPU)
    if: inputs.suite == 'cuda' || inputs.suite == 'all'
    runs-on: [self-hosted, gpu, cuda]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Persistent self-hosted runner: caching ~/.cargo/bin snapshots the
          # host's rustup/cargo proxies and clobbers them on restore (the CAEF
          # cache-bin gotcha — observed deleting the rustup binary itself).
          # Hosted runners are ephemeral so the default is harmless there.
          cache-bin: "false"

      # `just` is present on the box (it drives these recipes manually today),
      # so call the recipe directly — the strongest CI parity (single source of
      # truth, no hand-copied cargo line to drift). Mirrors `just test-cuda`.
      - name: cuda GPU smokes
        run: just test-cuda

  # wgpu on this Linux box resolves to the Vulkan path, which burn#5162
  # corrupts (params-only pruned backward — see the cross-platform truth table
  # in .claude/rules/burn-wgpu-metal-numerics.md). This job may come back RED
  # until the upstream fix lands; it is kept as the CAEF-mirror portability
  # proof and the canary that flips green when burn#5162 is fixed.
  wgpu-smokes:
    name: wgpu smokes (self-hosted GPU)
    if: inputs.suite == 'wgpu' || inputs.suite == 'all'
    runs-on: [self-hosted, gpu, wgpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Persistent self-hosted runner — see the cuda job's cache-bin note.
          cache-bin: "false"

      - name: wgpu GPU smokes
        run: just test-wgpu

  # The #96 on-box int8 proof: load a real Krea-2 denoiser as per-block int8 at
  # full krea2() depth on cuda and report coverage, resident VRAM, and
  # real-weight dequant error. The quant_probe is load + dequant-error
  # measurement only (no training step), so it runs regardless of the training
  # step's status — the real training step is VRAM-bound per ADR-0005
  # (docs/adrs/0005-int4-training-vram-bound.md). Opt-in via int8_probe
  # because it loads ~20 GB and needs the multi-GB checkpoint staged on the box.
  int8-probe:
    name: int8 quant probe (#96, self-hosted GPU)
    if: inputs.int8_probe
    runs-on: [self-hosted, gpu, cuda]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Persistent self-hosted runner — see the cuda job's cache-bin note.
          cache-bin: "false"

      # Mirrors `just quant-probe <denoiser>`.
      - name: int8 VRAM / dequant proof
        run: just quant-probe "${{ inputs.denoiser }}"

  # The #110 step-throughput bench: time REAL training steps on the real model
  # and emit the `loractl-bench` RESULT / SANITY / MODEL lines. Runs the
  # `bench_step` example via `just bench` — the same path the on-box manual run
  # takes. Warm-up is handled inside the harness (`--warmup N` excludes the
  # leading windows from the aggregate), so this is one dispatch, not two
  # passes. Opt-in via `bench` because it loads the multi-GB checkpoint and
  # holds the GPU for the whole run.
  #
  # The output lines ARE the deliverable, so they are teed to a file and
  # uploaded as an artifact — a run whose log scrolls away has produced
  # nothing. Read the `MODEL` line before quoting any `tok_s=`/`tflops=`, and
  # discard any aggregate reading `sanity=SUSPECT` / `plausible=false`.
  bench:
    name: step-throughput bench (#110, self-hosted GPU)
    if: inputs.bench
    runs-on: [self-hosted, gpu, cuda]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Persistent self-hosted runner — see the cuda job's cache-bin note.
          cache-bin: "false"

      # Mirrors `just bench <config> [flags]`. Args are forwarded verbatim so a
      # dispatch can change config, --steps, or --seq-len without editing CI.
      #
      # `pipefail` is load-bearing: the default GitHub shell is `bash -e {0}`,
      # which reports the exit status of the LAST command in a pipe — i.e.
      # `tee`, which always succeeds. Without it an OOM or a mid-bench panic
      # would report a GREEN job, which is exactly the silent-corruption shape
      # `just step-probe`'s zero-panic caveat exists to prevent.
      #
      # Inputs go through `env:` rather than being interpolated into `run:`
      # directly, so a dispatch value cannot inject shell. `$BENCH_ARGS` is
      # deliberately unquoted — it must word-split into separate arguments.
      # A bench is a measurement, so it must refuse to produce a number it
      # cannot stand behind. Both checks below failed SILENTLY before, as a
      # plausible-looking result rather than an error:
      #
      #   * A missing dataset surfaced as `reading dataset directory <path>`
      #     only after a full model load.
      #   * GPU contention surfaced as `non-finite loss (NaN) at step 1`. That
      #     is not a numerics failure — ComfyUI was holding 17.6 GB of the
      #     24.5 GB card, allocations failed, and the run trained on corrupt
      #     values. Per ADR-0005 the giveaway is `Memory page 0 doesn't exist`
      #     on a `DS*` thread (a failed alloc leaves its handle at the
      #     uninitialized {pool:0,page:0} default), which cubecl swallows.
      #
      # 4 GiB of headroom is the floor, not the requirement: the measured
      # int4 + block-checkpointing config peaks at 19.4 GB (ADR-0005 Addendum
      # 3), so this catches a card that is already largely spoken for while
      # staying loose enough not to fail on a few hundred MiB of desktop use.
      - name: Preflight — dataset present and GPU uncontended
        shell: bash -euo pipefail {0}
        env:
          DATASET: ${{ inputs.bench_dataset }}
        run: |
          if [ ! -d "$DATASET" ]; then
            echo "::error::bench dataset not found: $DATASET"
            echo "Stage it on the runner, or dispatch with a bench_dataset that exists."
            exit 1
          fi
          # -maxdepth 1 on purpose: the loader scans ONE level, so a nested
          # kohya_ss-style tree must fail here rather than later as "0 images".
          images=$(find "$DATASET" -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) | wc -l | tr -d ' ')
          if [ "$images" -eq 0 ]; then
            echo "::error::bench dataset has no .png/.jpg/.jpeg at its top level: $DATASET"
            echo "The loader scans one level only and silently skips other extensions."
            exit 1
          fi
          echo "dataset ok: $images image(s) in $DATASET"

          free_mib=$(nvidia-smi --query-gpu=memory.free --format=csv,noheader,nounits | head -1)
          echo "GPU free: ${free_mib} MiB"
          nvidia-smi --query-compute-apps=pid,process_name,used_gpu_memory --format=csv || true
          if [ "$free_mib" -lt 4096 ]; then
            echo "::error::only ${free_mib} MiB GPU memory free — another process is holding the card."
            echo "A contended run does not fail cleanly: it OOMs mid-step and reports a NaN loss."
            echo "If it is an idle ComfyUI cache, release it and re-dispatch:"
            echo "  curl -X POST http://127.0.0.1:8188/free -H 'Content-Type: application/json' -d '{\"unload_models\":true,\"free_memory\":true}'"
            exit 1
          fi

      - name: step-throughput bench
        shell: bash -euo pipefail {0}
        env:
          BENCH_ARGS: ${{ inputs.bench_args }}
          # config/examples/krea2-comfyui.yaml ships PLACEHOLDER paths
          # (`/home/you/ComfyUI/models`, `/path/to/dataset`), so a real run must
          # override both. They go in as FLAGS, not `LORACTL_` env vars:
          # `bench_step` reads its config from the file plus flags only (it says
          # so in its header, as does `step_probe`), because a measurement must
          # be fully described by the invocation the log records. This also
          # matches how `denoiser` reaches the int8 probe — as an argument.
          MODEL_BASE: ${{ inputs.bench_model_base }}
          DATASET: ${{ inputs.bench_dataset }}
        run: |
          # shellcheck disable=SC2086
          # Word-splitting is the point here: BENCH_ARGS carries a config path
          # plus separate flags, not a single argument. The two paths are quoted
          # separately so a directory with a space cannot split.
          just bench $BENCH_ARGS --model-base "$MODEL_BASE" --dataset "$DATASET" 2>&1 | tee bench.log

      # `always()`: a run that OOMs or panics mid-bench still wrote the RESULT
      # lines it managed, and those are exactly what diagnosis needs.
      - name: Upload bench log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-log
          path: bench.log
          if-no-files-found: error
