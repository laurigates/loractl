[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "laurigates/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Custom job: mints a laurigates-homebrew-tap App token instead of dist's
# built-in homebrew job, which needs a static HOMEBREW_TAP_TOKEN (ADR-0014)
publish-jobs = ["./publish-homebrew"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# release-please creates the GitHub Release and its tag; dist uploads to it (ADR-0014)
create-release = false

# Actions pinned to the same tags as ci.yml
[dist.github-action-commits]
"actions/checkout" = "v7.0.1"
"actions/upload-artifact" = "v7.0.2"
"actions/download-artifact" = "v8.0.2"
