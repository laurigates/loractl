# The exact config behind the M14 / #25 interop proof: a "sks dog" DreamBooth
# subject LoRA trained on Krea-2-Raw through DiffusionTrainer, whose kohya
# export visibly conditions Krea-2-Turbo generation in ComfyUI (LoRA off → a
# generic dog; on → the trained corgi + studio backdrop).
#
# This is a concrete instance of config/examples/krea2-comfyui.yaml — the
# scattered ComfyUI component paths plus the cuda f32 / int4 / block-checkpointing
# 24 GB-card route. See that file for the full commentary on the model.* path
# overrides and the memory route; only the deltas are noted here:
#   - lora.targets covers every MMDiT trunk projection (blocks\.), not just attn
#   - 300 steps

task: flow-matching

model:
  base: /path/to/ComfyUI/models       # your ComfyUI models/ root
  variant: krea2
  denoiser:     diffusion_models/krea2/krea2_raw_fp8_scaled.safetensors
  text_encoder: text_encoders/qwen/qwen3vl_4b_fp8_scaled.safetensors
  vae:          vae/qwen/qwen_image_vae.safetensors

dataset:
  path: /path/to/dreambooth-dog        # the 5-image DreamBooth "dog" set
                                       # (google/dreambooth), each with a
                                       # "a photo of sks dog" .txt caption
  resolution: 512                      # the ONLY resolution this `compute:`
                                       # route has been measured at: 19.4 GB
                                       # peak, zero panics (ADR-0005 Addendum
                                       # 3). 1024px is a 4608-token trunk
                                       # sequence against 1536 here — a 3× step,
                                       # unmeasured. Re-probe with
                                       # `just step-probe` before trusting it.
  batch_size: 1

lora:
  rank: 16
  alpha: 16.0
  targets:
    - pattern: 'blocks\.'              # every MMDiT trunk projection

optim:
  lr: 1.0e-4

steps: 300
seed: 42

output:
  dir: output/krea2-dog
  name: krea2-dog
  checkpoint_every: 100
# Resume (#180). Optional — omitting this block keeps the historical
# behaviour: if `{output.dir}/{output.name}.safetensors` already exists it is
# loaded and training CONTINUES from it.
#
# `steps` above is a TOTAL, not a remainder: resuming an artifact that records
# 200 steps with `steps: 500` executes steps 201..=500. Re-running an
# already-complete config therefore trains zero further steps rather than
# adding another `steps` worth.
#
# AdamW's moments, the loss scale and the step counter round-trip through a
# `{name}.optim.safetensors` sidecar written beside every checkpoint. It is
# ours alone — no LoRA loader keys on it — and it is looked for beside the
# SOURCE, so recovering into a clean output dir still restores the optimizer.
# The RNG stream is NOT restored, so a resumed run is a continuation and not a
# bit-identical replay of an uninterrupted one.
# resume:
#   from: output/krea2-dog/checkpoint-400.safetensors      # explicit source; skips `auto`
#   auto: true            # false (or --no-resume) forces a fresh start
#   allow_unfinished: false # true (or --resume-unfinished) lets `auto` take an
#                           # artifact whose __metadata__ says its run did not
#                           # finish — e.g. a checkpoint copied over the final
#                           # file after a crash. `from` never needs it.

# cuda f32 + int4 frozen-base quant + block-level gradient checkpointing — the
# 24 GB-card route (full rationale in krea2-comfyui.yaml and ADR-0005). This
# exact combination measured 19.4 GB peak at 512px (ADR-0005 Addendum 3);
# re-verify with `just step-probe` after changing resolution or targets — the
# gate is a zero-panic run, not a survived OOM storm.
compute:
  backend: cuda
  precision: f32
  quant: int4
  grad_checkpointing: true

flow:
  shift_mode: resolution              # ai-toolkit Krea 2 parity (#84)

# Embedded in the exported .safetensors' `__metadata__` header, alongside the
# training record loractl derives (rank/alpha, lr, optimizer, steps, buckets,
# `ss_tag_frequency` from the captions). `trigger_words` is what a UI shows as
# the phrase to type — for this DreamBooth set, the caption token itself.
# Inspect any LoRA's header with `loractl inspect <file>`.
metadata:
  trigger_words: ["sks dog"]
  title: SKS dog (Krea 2)
  description: A DreamBooth subject LoRA for the google/dreambooth "dog" set.
  license: apache-2.0
