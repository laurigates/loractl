# Example loractl training config.
# Copy into config/ and edit; every field below can also be overridden by a
# LORACTL_-prefixed env var (e.g. LORACTL_OPTIM__LR=5e-5) or a CLI flag
# (e.g. `loractl train config/my.yaml --lr 5e-5 --steps 2000`).

steps: 1000
seed: 42

model:
  # "synthetic" (the offline LoRA-MLP demo trainer), "mnist" (the demo
  # trainer's opt-in real-MNIST path — build with --features mnist), or a
  # path to a Krea-2-Raw checkpoint directory, which routes the run to the
  # M14 diffusion trainer (see config/examples/krea2-lora.yaml).
  base: synthetic

lora:
  rank: 16
  alpha: 16
  dropout: 0.0

dataset:
  # Folder of images + same-named .txt caption files.
  path: ./data/my-subject
  resolution: 512

optim:
  lr: 1.0e-4
  weight_decay: 0.0

output:
  dir: ./output
  name: my-lora
  checkpoint_every: 250
  sample_every: 0 # write a validation sample every N steps (0 = disabled)

# Resume (#180). Optional — omitting this block keeps the historical
# behaviour: if `{output.dir}/{output.name}.safetensors` already exists it is
# loaded and training CONTINUES from it.
#
# `steps` above is a TOTAL, not a remainder: resuming an artifact that records
# 200 steps with `steps: 500` executes steps 201..=500. Re-running an
# already-complete config therefore trains zero further steps rather than
# adding another `steps` worth.
#
# AdamW's moments, the loss scale and the step counter round-trip through a
# `{name}.optim.safetensors` sidecar written beside every checkpoint. It is
# ours alone — no LoRA loader keys on it — and it is looked for beside the
# SOURCE, so recovering into a clean output dir still restores the optimizer.
# The RNG stream is NOT restored, so a resumed run is a continuation and not a
# bit-identical replay of an uninterrupted one.
# resume:
#   from: ./output/checkpoint-250.safetensors      # explicit source; skips `auto`
#   auto: true            # false (or --no-resume) forces a fresh start
#   allow_unfinished: false # true (or --resume-unfinished) lets `auto` take an
#                           # artifact whose __metadata__ says its run did not
#                           # finish — e.g. a checkpoint copied over the final
#                           # file after a crash. `from` never needs it.

# Compute backend + device (M7). Optional — omitting this block runs on the
# ndarray CPU backend, exactly as before. GPU backends need the matching build
# feature (e.g. `cargo run -p loractl-cli --features wgpu`), else the run bails.
# compute:
#   backend: ndarray # ndarray (default, CPU/offline) | wgpu (GPU: Metal on macOS) | cuda | tch
#   device: 0        # GPU ordinal; ignored by ndarray. wgpu: 0 = default/best GPU
