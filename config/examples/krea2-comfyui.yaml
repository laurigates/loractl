# A real Krea 2 LoRA run pointing at a ComfyUI install's SCATTERED files —
# no restructuring into an HF snapshot dir, no duplicate files, no symlinks.
#
# ComfyUI keeps each component in its own tree under models/; the four
# model.*_path overrides point straight at those files. `base` is only the
# root that RELATIVE overrides join onto (and the fallback location for any
# component you DON'T override) — set it to your ComfyUI models/ dir.
#
# Absolute override paths are used verbatim; relative ones join onto `base`.

task: flow-matching

model:
  base: /home/you/ComfyUI/models    # your ComfyUI models/ root
  variant: krea2                    # architecture; the denoiser below is a Krea-2 scaled-fp8 repack
  denoiser:     diffusion_models/krea2/krea2_raw_fp8_scaled.safetensors
  text_encoder: text_encoders/qwen/qwen3vl_4b_fp8_scaled.safetensors
  vae:          vae/qwen/qwen_image_vae.safetensors
  # tokenizer: omitted — ComfyUI ships no tokenizer.json, so loractl fetches
  #            the model-invariant Qwen3-VL tokenizer once (SHA-256 pinned,
  #            cached under HF_HOME) automatically. Set this only to use a
  #            tokenizer.json you already have:
  # tokenizer:  /path/to/qwen3vl/tokenizer.json
  # training_adapter: for Krea-2-Turbo (variant: krea2-turbo) only — an optional
  #   assistant LoRA (ostris/krea2_turbo_training_adapter) merged into the frozen
  #   base at load (`W += (alpha/rank)·B·A`), ai-toolkit's distillation-aware
  #   turbo recipe. The trained adapter still deploys on plain turbo. Needs a
  #   full-precision base — incompatible with compute.quant. See issue #83.
  # training_adapter: diffusion_models/krea2/krea2_turbo_training_adapter.safetensors

dataset:
  path: /path/to/dataset            # images + same-named .txt captions
  resolution: 512                   # multiple of 16 — and the ONLY resolution
                                    # the `compute:` route below has been
                                    # measured at: 19.4 GB peak, zero panics
                                    # (ADR-0005 Addendum 3). Raising it raises
                                    # the trunk SEQUENCE, not the pixel count —
                                    # 1024px is 4608 tokens against 1536 here,
                                    # a 3× step, and nothing at that size has
                                    # been measured. Re-probe with
                                    # `just step-probe` before trusting it; a
                                    # run outside this point gets a warning
                                    # before the encode phase (#179).
  batch_size: 1

lora:
  rank: 16
  alpha: 16.0
  # Target choice is a SCOPE/QUALITY decision, not a memory lever (ADR-0005
  # Addendum 2: retention is topology-driven — one adapter anywhere tracks
  # the whole downstream trunk). Alternatives:
  #   - pattern: 'blocks\.'               # every trunk projection
  #   - pattern: 'attn\.(wq|wv)$'         # minimal q/v-only set
  targets:
    - pattern: 'blocks\.\d+\.attn\.'    # attention projections only

optim:
  lr: 1.0e-4

steps: 500
seed: 42

output:
  dir: output/krea2-lora
  name: krea2-lora
# Resume (#180). Optional — omitting this block keeps the historical
# behaviour: if `{output.dir}/{output.name}.safetensors` already exists it is
# loaded and training CONTINUES from it.
#
# `steps` above is a TOTAL, not a remainder: resuming an artifact that records
# 200 steps with `steps: 500` executes steps 201..=500. Re-running an
# already-complete config therefore trains zero further steps rather than
# adding another `steps` worth.
#
# AdamW's moments, the loss scale and the step counter round-trip through a
# `{name}.optim.safetensors` sidecar written beside every checkpoint. It is
# ours alone — no LoRA loader keys on it — and it is looked for beside the
# SOURCE, so recovering into a clean output dir still restores the optimizer.
# The RNG stream is NOT restored, so a resumed run is a continuation and not a
# bit-identical replay of an uninterrupted one.
# resume:
#   from: output/krea2-lora/checkpoint-400.safetensors      # explicit source; skips `auto`
#   auto: true            # false (or --no-resume) forces a fresh start
#   allow_unfinished: false # true (or --resume-unfinished) lets `auto` take an
#                           # artifact whose __metadata__ says its run did not
#                           # finish — e.g. a checkpoint copied over the final
#                           # file after a crash. `from` never needs it.

# The numerically-clean GPU route on a 24 GB NVIDIA card: cuda f32 + int4
# frozen-base quantization (int4 reclaims to ~10.1 GB resident; int8's
# ~17.1 GB step OOMed) + block-level gradient checkpointing (#134):
# `grad_checkpointing: true` stores only block inputs and replays block
# interiors in backward, collapsing the monolithic step's measured
# 67.9 GiB of pinned demand (ADR-0005 Addendum 2) to ~1 residual-stream
# tensor per block plus one transient block graph. Requires
# `lora.dropout: 0` (a replay would redraw masks). Measured at 512px:
# 19.4 GB peak, zero panics (ADR-0005 Addendum 3). Re-verify fit with
# `just step-probe` after changing resolution or targets — the gate is a
# zero-panic run, not a survived OOM storm.
compute:
  backend: cuda
  precision: f32
  quant: int4
  grad_checkpointing: true

flow:
  shift_mode: resolution            # ai-toolkit Krea 2 parity (#84): per-batch
                                    # shift exp(μ), μ linear 0.5@256 → 1.15@6400
                                    # image tokens
