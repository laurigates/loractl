# A real Krea 2 LoRA training run (M14) — the DiffusionTrainer end to end.
#
# `model.base` points at a krea/Krea-2-Raw HF snapshot directory:
#   raw.safetensors, text_encoder/model.safetensors,
#   tokenizer/tokenizer.json, vae/diffusion_pytorch_model.safetensors
# (e.g. the copy `just mmdit-real-reference` leaves under
# crates/loractl-core/tests/fixtures/krea2-raw/ — complete it with the
# text_encoder/tokenizer/vae subfolders, or download the full snapshot).
#
# Memory (48 GiB host): f16 + activation checkpointing fits the ~12B base
# (~24.6 GB weights); run with `--features wgpu` (Metal).
#
# cuda alternative (Linux + NVIDIA): `compute.backend: cuda` with
# `precision: f32` — the numerically-clean GPU path (burn#5162 breaks non-f32
# autodiff on every GPU backend). Full-depth f32 is ~49 GB (beyond a 24 GB
# card), so quantize the frozen base (#96). Measured on the RTX 4090
# (ADR-0005 Addendum 1 item 2): the reclaimed int4 base is ~10.1 GiB
# (10,345 MiB), and the MONOLITHIC step then rode the ~23.6 GB usable
# ceiling — which is why int8's substantially larger resident base leaves no
# room for a TRAINING step on 24 GB; int8 is inference/forward only. With
# `grad_checkpointing: true` the int4 step measures 19.4 GB peak with ~4 GB
# headroom (ADR-0005 Addendum 3) — that is the combination the #25 real run
# used. See ADR-0005 + config/examples/krea2-comfyui.yaml for the target-set
# guidance. Swap the `compute:` block at the bottom for this commented one:
#
#   compute:
#     backend: cuda
#     precision: f32        # quant dequantizes to f32; f16/bf16 are rejected
#     quant: int4           # frozen-base int4 (QLoRA); adapters stay f32
#     grad_checkpointing: true  # the knob that makes the step fit (ADR-0005 A3)

task: flow-matching

model:
  base: /path/to/krea-2-raw    # the snapshot directory described above
  variant: krea2               # or krea2-turbo (same architecture; the denoiser
                               # then defaults to turbo.safetensors) | tiny-krea2
  # checkpoint: krea2_turbo_fp8_scaled.safetensors
  #                            # optional denoiser filename within base, overriding
  #                            # the variant default; scaled-fp8 repacks are
  #                            # auto-detected from the file header (M15)

dataset:
  path: /path/to/dataset       # images + same-named .txt captions
  resolution: 512              # multiple of 16 — and the only resolution any
                               # real Krea 2 route in this repo has been
                               # measured at (19.4 GB peak at 512px, int4 +
                               # grad_checkpointing on a 24 GB card, ADR-0005
                               # Addendum 3). Raising it raises the trunk
                               # SEQUENCE, not the pixel count: 1024px is 4608
                               # tokens against 1536 here, a 3× step. Re-probe
                               # with `just step-probe` before trusting it.
  batch_size: 1
  # no_upscale: true           # (#147) never enlarge a small image to fill its
  #                            # bucket — it gets a smaller aligned box instead
  # bucketing: grid            # (#148) aspects (default, 7 fixed ratios) | grid
  #                            # (kohya-style 2-D grid: caps worst-case crop at
  #                            # ~4% across 0.25–4.0, slightly worse than the
  #                            # fixed list at 4:3, and MANY more buckets — so
  #                            # more size-1 batches. See the README table.)
  # min_bucket_resolution: 256 # grid only; shortest bucket side, multiple of
  #                            # 16. Defaults to resolution / 2.

lora:
  rank: 16
  alpha: 16.0
  targets:
    - pattern: 'blocks\.'      # every MMDiT trunk projection

optim:
  lr: 1.0e-4

steps: 500
seed: 42

output:
  dir: output/krea2-lora
  name: krea2-lora             # -> output/krea2-lora/krea2-lora.safetensors (kohya-ss)
  checkpoint_every: 100
  sample_every: 0              # no classifier sample path in the diffusion trainer

# Resume (#180). Optional — omitting this block keeps the historical
# behaviour: if `{output.dir}/{output.name}.safetensors` already exists it is
# loaded and training CONTINUES from it.
#
# `steps` above is a TOTAL, not a remainder: resuming an artifact that records
# 200 steps with `steps: 500` executes steps 201..=500. Re-running an
# already-complete config therefore trains zero further steps rather than
# adding another `steps` worth.
#
# AdamW's moments, the loss scale and the step counter round-trip through a
# `{name}.optim.safetensors` sidecar written beside every checkpoint. It is
# ours alone — no LoRA loader keys on it — and it is looked for beside the
# SOURCE, so recovering into a clean output dir still restores the optimizer.
# The RNG stream is NOT restored, so a resumed run is a continuation and not a
# bit-identical replay of an uninterrupted one.
# resume:
#   from: output/krea2-lora/checkpoint-400.safetensors      # explicit source; skips `auto`
#   auto: true            # false (or --no-resume) forces a fresh start
#   allow_unfinished: false # true (or --resume-unfinished) lets `auto` take an
#                           # artifact whose __metadata__ says its run did not
#                           # finish — e.g. a checkpoint copied over the final
#                           # file after a crash. `from` never needs it.

compute:
  backend: wgpu
  precision: f16
  grad_checkpointing: true

flow:
  shift_mode: resolution       # ai-toolkit Krea 2 parity (#84): per-batch shift
                               # exp(μ), μ linear 0.5@256 → 1.15@6400 image
                               # tokens (the anchor defaults; override with
                               # base/max_image_seq_len + base/max_shift).
                               # `constant` + `shift: 3.0` is the kohya/SD3
                               # fallback.

# Provenance embedded in the exported .safetensors' `__metadata__` header —
# what ComfyUI/Forge/Civitai read back off the file. Everything a run already
# knows (rank, alpha, lr, optimizer, steps, epochs, buckets, tag frequency) is
# derived automatically; only these author-supplied fields are configured.
# `loractl inspect <file>` prints the result; `metadata: {embed: false}` (or
# `--no-metadata`) writes no header at all.
metadata:
  trigger_words: ["my-style"]   # -> ss_trained_words + modelspec.trigger_phrase
  # title: My Style
  # description: What this LoRA does.
  # author: you
  # license: apache-2.0
  # tags: [style, illustration]
